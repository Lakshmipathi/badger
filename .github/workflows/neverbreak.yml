name: neverbreak
on:
  push:
  workflow_dispatch:

jobs:
  race-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test -race TestCloseCommitRace
        run: go test -race -count=1 -timeout=90s -run TestCloseCommitRace .
        env:
          GOMAXPROCS: "4"
